[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "image-multisize-resizer"
version = "0.1.0"
authors = [
  { name="Ishan", email="ishandutta2007@gmail.com" },
]
description = "A CLI tool to resize an image into multiple sizes proportionally."
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "Pillow>=9.5.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
multi-resizer = "multi_resizer:main"
