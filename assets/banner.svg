<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E30" />
      <stop offset="100%" stop-color="#243B55" />
      <animate attributeName="x2" values="100%;0%;100%" dur="5s" repeatCount="indefinite" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="20" ry="20"/>
  <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff" filter="url(#glow)">
    Image Multisize Resizer
  </text>
  <text x="50%" y="65%" dominant-baseline="middle" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#00D2FF" letter-spacing="2">
    ⚡ BATCH IMAGE RESIZING CLI TOOL ⚡
  </text>
  <rect x="350" y="140" width="10" height="10" fill="none" stroke="#00D2FF" stroke-width="2" rx="2" ry="2">
    <animate attributeName="width" values="10;80;10" dur="2s" repeatCount="indefinite" />
    <animate attributeName="height" values="10;30;10" dur="2s" repeatCount="indefinite" />
    <animate attributeName="x" values="395;360;395" dur="2s" repeatCount="indefinite" />
    <animate attributeName="y" values="145;135;145" dur="2s" repeatCount="indefinite" />
  </rect>
</svg>
